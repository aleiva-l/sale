name: Actualizar comercios desde Google Sheets

on:
  workflow_dispatch:

  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-comercios
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Actualizar comercios.json
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
        run: |
          python sync_sheet_to_json.py

      - name: Commit si hubo cambios
        run: |
          if git diff --quiet -- comercios.json; then
            echo "No hubo cambios en comercios.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add comercios.json
          git commit -m "chore: actualizar comercios desde Google Sheets"
          git push
